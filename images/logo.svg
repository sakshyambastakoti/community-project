<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="brandRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E52E2E"/>
      <stop offset="100%" stop-color="#B81919"/>
    </linearGradient>
  </defs>

  <!-- Outer Dark Circle Frame -->
  <circle cx="100" cy="90" r="75" fill="#1A1A1A"/>
  
  <!-- Outer Gear Teeth -->
  <path d="M100 5 L106 18 L118 18 L124 5 L138 12 L138 25 L149 29 L159 20 L170 31 L161 41 L165 52 L178 52 L185 66 L172 72 L172 84 L185 90 L178 104 L165 104 L161 115 L170 125 L159 136 L149 127 L138 131 L138 144 L124 151 L118 138 L106 138 L100 151 L86 144 L86 131 L75 127 L65 136 L54 125 L63 115 L59 104 L46 104 L39 90 L52 84 L52 72 L39 66 L46 52 L59 52 L63 41 L54 31 L65 20 L75 29 L86 25 L86 12 Z" fill="#2A2A2A"/>

  <!-- Inner Cream Background Ring -->
  <circle cx="100" cy="90" r="58" fill="#F7F5EE"/>

  <!-- Crossed Red Tools Emblem (Wrench & Screwdriver) -->
  <!-- Screwdriver diagonal -->
  <rect x="94" y="35" width="12" height="110" rx="3" fill="url(#brandRedGrad)" transform="rotate(45 100 90)"/>
  <rect x="91" y="25" width="18" height="22" rx="2" fill="#1A1A1A" transform="rotate(45 100 90)"/>
  
  <!-- Wrench diagonal -->
  <rect x="94" y="35" width="12" height="110" rx="3" fill="url(#brandRedGrad)" transform="rotate(-45 100 90)"/>
  <!-- Wrench Head Cutout -->
  <path d="M 80 40 L 100 20 L 120 40 L 108 52 L 100 42 L 92 52 Z" fill="#1A1A1A" transform="rotate(-45 100 90)"/>

  <!-- Center Microchip Node -->
  <rect x="85" y="75" width="30" height="30" rx="4" fill="#1A1A1A"/>
  <circle cx="100" cy="90" r="7" fill="url(#brandRedGrad)"/>
  
  <!-- Typography ROBOYUWA -->
  <text x="100" y="185" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="3" fill="#1A1A1A" text-anchor="middle">ROBOYUWA</text>
</svg>
